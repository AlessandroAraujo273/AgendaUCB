<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgendaUCB - Cadastro de Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-100 min-h-screen py-10 px-4 font-sans text-slate-800 flex justify-center"
  >
    <div
      class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden"
    >
      <div
        class="p-6 bg-slate-900 text-white flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-black text-lg"
          >
            UCB
          </div>
          <div>
            <h1 class="text-lg font-bold">Criar Nova Conta</h1>
            <p class="text-xs text-slate-400">
              Preencha seus dados para acessar o AgendaUCB
            </p>
          </div>
        </div>
        <a href="login.html" class="text-xs text-blue-400 hover:underline"
          >Já tenho conta</a
        >
      </div>

      <!-- Alertas -->
      <div
        id="alerta-cadastro"
        class="hidden m-6 mb-0 p-4 text-xs font-semibold rounded-lg border"
      ></div>

      <form id="form-cadastro" class="p-6 space-y-4">
        <!-- Dados Básicos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Nome *</label
            >
            <input
              type="text"
              id="nome"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Sobrenome *</label
            >
            <input
              type="text"
              id="sobrenome"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Campo CPF com Validação e Feedback -->
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >CPF *</label
            >
            <input
              type="text"
              id="cpf"
              placeholder="000.000.000-00"
              maxlength="14"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            />
            <p
              id="erro-cpf"
              class="hidden text-xs text-rose-600 mt-1 font-semibold flex items-center gap-1"
            >
              <span>⚠️</span> CPF inválido. Digite um CPF válido.
            </p>
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Data Nascimento * (AAAA-MM-DD)</label
            >
            <input
              type="date"
              id="data_nascimento"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >E-mail Institucional *</label
            >
            <input
              type="email"
              id="email_institucional"
              placeholder="nome@ucb.br"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Senha *</label
            >
            <input
              type="password"
              id="senha"
              minlength="4"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <!-- Tipo de Perfil e Departamento -->
        <div
          class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-slate-100"
        >
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Tipo de Usuário *</label
            >
            <select
              id="tipo_usuario"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 bg-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="ALUNO">Aluno</option>
              <option value="PROFESSOR">Professor</option>
              <option value="ADMINISTRATIVO">Administrativo</option>
            </select>
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >ID Departamento *</label
            >
            <input
              type="number"
              id="id_departamento"
              value="1"
              min="1"
              required
              class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <!-- CAMPOS ESPECÍFICOS (Alternam conforme o tipo) -->
        <div
          id="campos-aluno"
          class="p-3 bg-blue-50/50 rounded-lg border border-blue-100 grid grid-cols-1 sm:grid-cols-3 gap-3"
        >
          <div>
            <label
              class="block text-[11px] font-semibold text-blue-900 uppercase mb-1"
              >Matrícula</label
            >
            <input
              type="text"
              id="aluno-matricula"
              placeholder="UC2024..."
              class="w-full px-2.5 py-1.5 text-sm rounded border border-blue-200"
            />
          </div>
          <div>
            <label
              class="block text-[11px] font-semibold text-blue-900 uppercase mb-1"
              >Curso</label
            >
            <input
              type="text"
              id="aluno-curso"
              placeholder="Engenharia de Software"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-blue-200"
            />
          </div>
          <div>
            <label
              class="block text-[11px] font-semibold text-blue-900 uppercase mb-1"
              >Semestre Atual</label
            >
            <input
              type="number"
              id="aluno-semestre"
              value="1"
              min="1"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-blue-200"
            />
          </div>
        </div>

        <div
          id="campos-professor"
          class="hidden p-3 bg-amber-50/50 rounded-lg border border-amber-100 grid grid-cols-1 sm:grid-cols-3 gap-3"
        >
          <div>
            <label
              class="block text-[11px] font-semibold text-amber-900 uppercase mb-1"
              >Matrícula Docente</label
            >
            <input
              type="text"
              id="prof-matricula"
              placeholder="DOC-123"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-amber-200"
            />
          </div>
          <div>
            <label
              class="block text-[11px] font-semibold text-amber-900 uppercase mb-1"
              >Titulação</label
            >
            <input
              type="text"
              id="prof-titulacao"
              placeholder="Mestre / Doutor"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-amber-200"
            />
          </div>
          <div>
            <label
              class="block text-[11px] font-semibold text-amber-900 uppercase mb-1"
              >Regime Trabalho</label
            >
            <input
              type="text"
              id="prof-regime"
              placeholder="Integral / 40h"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-amber-200"
            />
          </div>
        </div>

        <div
          id="campos-admin"
          class="hidden p-3 bg-purple-50/50 rounded-lg border border-purple-100 grid grid-cols-1 sm:grid-cols-3 gap-3"
        >
          <div>
            <label
              class="block text-[11px] font-semibold text-purple-900 uppercase mb-1"
              >Cargo</label
            >
            <input
              type="text"
              id="adm-cargo"
              placeholder="Coordenador de TI"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-purple-200"
            />
          </div>
          <div>
            <label
              class="block text-[11px] font-semibold text-purple-900 uppercase mb-1"
              >Setor</label
            >
            <input
              type="text"
              id="adm-setor"
              placeholder="Secretaria Geral"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-purple-200"
            />
          </div>
          <div>
            <label
              class="block text-[11px] font-semibold text-purple-900 uppercase mb-1"
              >Ramal</label
            >
            <input
              type="text"
              id="adm-ramal"
              placeholder="3356"
              class="w-full px-2.5 py-1.5 text-sm rounded border border-purple-200"
            />
          </div>
        </div>

        <div class="pt-4 flex items-center justify-end gap-3">
          <a
            href="login.html"
            class="px-4 py-2 text-sm text-slate-600 hover:underline"
            >Cancelar</a
          >
          <button
            type="submit"
            id="btn-cadastrar"
            class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition"
          >
            Finalizar Cadastro
          </button>
        </div>
      </form>
    </div>

    <script src="javascript/api.js"></script>
    <script>
      // === VALIDAÇÃO E MÁSCARA DE CPF ===
      function validarCPF(cpf) {
        const limpo = String(cpf).replace(/\D/g, "");
        if (limpo.length !== 11) return false;
        if (/^(\d)\1{10}$/.test(limpo)) return false;

        // 1º dígito
        let soma = 0;
        for (let i = 0; i < 9; i++) {
          soma += parseInt(limpo.charAt(i), 10) * (10 - i);
        }
        let resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(limpo.charAt(9), 10)) return false;

        // 2º dígito
        soma = 0;
        for (let i = 0; i < 10; i++) {
          soma += parseInt(limpo.charAt(i), 10) * (11 - i);
        }
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(limpo.charAt(10), 10)) return false;

        return true;
      }

      function aplicarMascaraCPF(valor) {
        return valor
          .replace(/\D/g, "")
          .slice(0, 11)
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      }

      const inputCpf = document.getElementById("cpf");
      const erroCpf = document.getElementById("erro-cpf");

      // Formatação automática durante a digitação
      inputCpf.addEventListener("input", (e) => {
        e.target.value = aplicarMascaraCPF(e.target.value);
        erroCpf.classList.add("hidden");
        inputCpf.classList.remove("border-rose-500", "focus:ring-rose-500");
      });

      // Validação ao sair do campo
      inputCpf.addEventListener("blur", () => {
        const valor = inputCpf.value.trim();
        if (!valor) return;

        if (!validarCPF(valor)) {
          erroCpf.classList.remove("hidden");
          inputCpf.classList.add("border-rose-500", "focus:ring-rose-500");
        } else {
          erroCpf.classList.add("hidden");
          inputCpf.classList.remove("border-rose-500", "focus:ring-rose-500");
        }
      });

      // Alternar campos dinâmicos por tipo
      const selectTipo = document.getElementById("tipo_usuario");
      const boxAluno = document.getElementById("campos-aluno");
      const boxProf = document.getElementById("campos-professor");
      const boxAdmin = document.getElementById("campos-admin");

      selectTipo.addEventListener("change", () => {
        boxAluno.classList.add("hidden");
        boxProf.classList.add("hidden");
        boxAdmin.classList.add("hidden");

        if (selectTipo.value === "ALUNO") boxAluno.classList.remove("hidden");
        if (selectTipo.value === "PROFESSOR")
          boxProf.classList.remove("hidden");
        if (selectTipo.value === "ADMINISTRATIVO")
          boxAdmin.classList.remove("hidden");
      });

      // Submissão do cadastro
      document
        .getElementById("form-cadastro")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const alerta = document.getElementById("alerta-cadastro");
          const btn = document.getElementById("btn-cadastrar");

          const cpfValor = inputCpf.value.trim();

          // Validação bloqueante de CPF antes do envio
          if (!validarCPF(cpfValor)) {
            erroCpf.classList.remove("hidden");
            inputCpf.classList.add("border-rose-500", "focus:ring-rose-500");
            inputCpf.focus();
            return;
          }

          alerta.className = "hidden";
          btn.disabled = true;

          const tipo = selectTipo.value;
          const payload = {
            nome: document.getElementById("nome").value.trim(),
            sobrenome: document.getElementById("sobrenome").value.trim(),
            cpf: cpfValor,
            data_nascimento: document.getElementById("data_nascimento").value,
            email_institucional: document
              .getElementById("email_institucional")
              .value.trim(),
            senha: document.getElementById("senha").value,
            tipo_usuario: tipo,
            id_departamento: parseInt(
              document.getElementById("id_departamento").value,
              10,
            ),
          };

          if (tipo === "ALUNO") {
            payload.matricula = document
              .getElementById("aluno-matricula")
              .value.trim();
            payload.curso = document.getElementById("aluno-curso").value.trim();
            payload.semestre_atual =
              document.getElementById("aluno-semestre").value;
          } else if (tipo === "PROFESSOR") {
            payload.matricula_docente = document
              .getElementById("prof-matricula")
              .value.trim();
            payload.titulacao = document
              .getElementById("prof-titulacao")
              .value.trim();
            payload.regime_trabalho = document
              .getElementById("prof-regime")
              .value.trim();
          } else if (tipo === "ADMINISTRATIVO") {
            payload.cargo = document.getElementById("adm-cargo").value.trim();
            payload.setor = document.getElementById("adm-setor").value.trim();
            payload.ramal = document.getElementById("adm-ramal").value.trim();
          }

          try {
            const resp = await API.post("/usuarios", payload);
            alerta.className =
              "m-6 mb-0 p-4 text-xs font-semibold rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 block";
            alerta.textContent = `${resp.mensagem || "Cadastro realizado com sucesso!"} Redirecionando para o login...`;
            setTimeout(() => (window.location.href = "login.html"), 2000);
          } catch (err) {
            alerta.className =
              "m-6 mb-0 p-4 text-xs font-semibold rounded-lg bg-rose-50 border border-rose-200 text-rose-800 block";
            alerta.textContent = `Erro ao cadastrar: ${err.message}`;
          } finally {
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
